brouillon: "palmage.pdf"
rattachement: "Rattachement à confirmer : ce brouillon couvre aussi le palmage dorsal, costal et de sustentation."
blanc:
  - champ: "Objectif final"
    texte:
      - "Se déplacer efficacement, sans fatigue"
  - champ: "Position dans la formation"
    texte:
      - "Début"
  - champ: "Prérequis"
    texte:
      - "Savoir nager"
      - "Utilisation d'un masque et d'un tuba (sais le vider)"
  - champ: "Critères d'évaluation"
    texte:
      - "Faire les exercices sans s'essoufler"
  - champ: "Organisation"
