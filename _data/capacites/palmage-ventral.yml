  texte:
    - "Mauvais geste -&gt; revoir la posture"
    - "Essoufflement -&gt; revoir la vitesse de déplacement et l'efficacité des mouvements"
seances:
  - titre: "Palmage"
    champs:
      - champ: "Objectif de séance"
        texte:
          - "Se déplacer et se maintenir en surface efficacement, sans fatigue"
      - champ: "Justification"
        texte:
          - "Se déplacer sans s'essouffler"
      - champ: "Description des exercices"
        texte:
          - "50m PMT puis tenir 3s d'apnée"
          - "25m dorsal puis tenir 3s d'apnée"
          - "25m costal puis tenir 3s d'apnée"
          - "10s sustentation puis tenir 3s d'apnée"
      - champ: "Points clés à donner aux élèves"
        texte:
          - "Explication de l'essoufflement"
          - "Geste: Jambe tendu mais souple, le mouvement vient du bassin, c'est les cuisses qui forcent pas les abdo, ni les mollets"
      - champ: "Consignes de sécurité"
        texte:
          - "pas de plongeurs"
          - "proche du bord"
      - champ: "Communication spécifique"
        texte:
          - "N/A"
      - champ: "Prochaine séance"
        texte:
          - "Nage capelée puis en immersion"
      - champ: "Notes"
        texte:
          - "Compléter la prez avec la sécu, je suis responsable du bassin"
          - "Brief prérequis a la séance contexte du bassin avant même d'aborder le sujet. C'est la partie pour le jury"
          - "Présentation perso et de l'élève"
          - "Planche comme outil"
          - "Rappel preragative 100m distance bateau"
          - "Initiation à l'apnée"
