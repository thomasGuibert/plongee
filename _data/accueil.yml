section_titre: "Compétences du Niveau 1"
section_intro: "Chaque compétence regroupe des capacités, et chaque capacité se travaille en une ou plusieurs séances. Une compétence est validée quand son savoir-faire, son savoir-être et son savoir sont acquis."
