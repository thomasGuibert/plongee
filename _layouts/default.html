<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>{{ site.title }}
      </a>
      <nav aria-label="Navigation principale">
        <a href="{{ '/' | relative_url }}#seances"{% if page.collection == 'seances' %} aria-current="page"{% endif %}>Séances</a>
        <a href="{{ '/referentiel/' | relative_url }}"{% if page.url == '/referentiel/' %} aria-current="page"{% endif %}>Référentiel N1</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Contenus basés sur le manuel de formation technique FFESSM Plongeur Niveau 1 (PE20, version décembre 2025)
      et le <a href="https://mft.readthedocs.io/fr/latest/04_Plongeur_niveau_1/">MFT en ligne</a>.
      L'ordre des techniques et leurs prérequis sont des choix pédagogiques du cours.
    </div>
  </footer>
</body>
</html>
